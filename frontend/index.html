<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TraceNet - Network Packet Analysis</title>
  </head>
  <body>
    <div id="root"></div>
    <canvas id="c" style="display:block;width:100%;height:500px;cursor:none;"></canvas>
    <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    let W, H, particles = [], mouse = {x: -999, y: -999};
    const N = 120, REPEL = 120, FORCE = 6;

    function resize() {
      const r = canvas.getBoundingClientRect();
      W = canvas.width = r.width;
      H = canvas.height = 500;
    }

    function hsl(h,s,l) { return `hsl(${h},${s}%,${l}%)`; }

    class Particle {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * W;
        this.y = Math.random() * H;
        this.ox = this.x;
        this.oy = this.y;
        this.vx = 0;
        this.vy = 0;
        this.r = Math.random() * 2.5 + 1;
        this.hue = Math.random() * 60 + 200;
        this.alpha = Math.random() * 0.5 + 0.4;
      }
      update() {
        const dx = this.x - mouse.x;
        const dy = this.y - mouse.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < REPEL && dist > 0) {
          const angle = Math.atan2(dy, dx);
          const push = (REPEL - dist) / REPEL * FORCE;
          this.vx += Math.cos(angle) * push;
          this.vy += Math.sin(angle) * push;
        }
        const homeX = (this.x - this.ox) * 0.05;
        const homeY = (this.y - this.oy) * 0.05;
        this.vx = (this.vx - homeX) * 0.88;
        this.vy = (this.vy - homeY) * 0.88;
        this.x += this.vx;
        this.y += this.vy;
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
        ctx.fillStyle = hsl(this.hue, 80, 70);
        ctx.globalAlpha = this.alpha;
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    function initParticles() {
      particles = [];
      for (let i = 0; i < N; i++) particles.push(new Particle());
    }

    function drawConnections() {
      for (let i = 0; i < particles.length; i++) {
        for (let j = i+1; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const d = Math.sqrt(dx*dx+dy*dy);
          if (d < 90) {
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.strokeStyle = hsl(220, 70, 70);
            ctx.globalAlpha = (1 - d/90) * 0.18;
            ctx.lineWidth = 0.6;
            ctx.stroke();
            ctx.globalAlpha = 1;
          }
        }
      }
    }

    function drawCursor() {
      if (mouse.x < 0) return;
      ctx.beginPath();
      ctx.arc(mouse.x, mouse.y, 6, 0, Math.PI*2);
      ctx.strokeStyle = 'rgba(180,200,255,0.7)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(mouse.x, mouse.y, REPEL, 0, Math.PI*2);
      ctx.strokeStyle = 'rgba(150,170,255,0.1)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    function loop() {
      ctx.clearRect(0,0,W,H);
      drawConnections();
      for (const p of particles) { p.update(); p.draw(); }
      drawCursor();
      requestAnimationFrame(loop);
    }

    canvas.addEventListener('mousemove', e => {
      const r = canvas.getBoundingClientRect();
      mouse.x = e.clientX - r.left;
      mouse.y = e.clientY - r.top;
    });
    canvas.addEventListener('mouseleave', () => { mouse.x = -999; mouse.y = -999; });
    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      const r = canvas.getBoundingClientRect();
      mouse.x = e.touches[0].clientX - r.left;
      mouse.y = e.touches[0].clientY - r.top;
    }, {passive:false});
    canvas.addEventListener('touchend', () => { mouse.x = -999; mouse.y = -999; });

    resize();
    initParticles();
    loop();
    window.addEventListener('resize', () => { resize(); initParticles(); });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
