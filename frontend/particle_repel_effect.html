<canvas id="c" style="display:block;width:100%;height:500px;cursor:none;touch-action:none;"></canvas>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  const CONFIG = {
    height: 500,
    baseParticles: 120,
    maxParticles: 180,
    minParticles: 60,
    linkDistance: 90,
    repelRadius: 120,
    repelForce: 0.42,
    spring: 0.045,
    friction: 0.90,
    maxDpr: 2
  };

  let W = 0;
  let H = 0;
  let DPR = 1;
  let particles = [];
  let rafId = 0;
  let lastTime = 0;

  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const pointer = {
    x: -9999,
    y: -9999,
    active: false
  };

  function hsla(h, s, l, a = 1) {
    return `hsla(${h}, ${s}%, ${l}%, ${a})`;
  }

  function getTargetParticleCount() {
    const areaBased = Math.floor((W * H) / 4200);
    let count = Math.max(CONFIG.minParticles, Math.min(CONFIG.maxParticles, areaBased));
    if (prefersReducedMotion) count = Math.max(36, Math.floor(count * 0.5));
    return count || CONFIG.baseParticles;
  }

  function resizeCanvas() {
    const prevW = W || 1;
    const prevH = H || 1;

    const rect = canvas.getBoundingClientRect();
    W = rect.width;
    H = rect.height || CONFIG.height;

    DPR = Math.min(window.devicePixelRatio || 1, CONFIG.maxDpr);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    if (particles.length) {
      const sx = W / prevW;
      const sy = H / prevH;

      for (const p of particles) {
        p.x *= sx;
        p.y *= sy;
        p.ox *= sx;
        p.oy *= sy;
      }
    }

    syncParticleCount();
  }

  class Particle {
    constructor() {
      this.x = Math.random() * W;
      this.y = Math.random() * H;
      this.ox = this.x;
      this.oy = this.y;
      this.vx = 0;
      this.vy = 0;
      this.r = Math.random() * 2.2 + 1;
      this.hue = 200 + Math.random() * 60;
      this.alpha = 0.45 + Math.random() * 0.35;
    }

    update(dt) {
      let ax = 0;
      let ay = 0;

      if (pointer.active) {
        const dx = this.x - pointer.x;
        const dy = this.y - pointer.y;
        const d2 = dx * dx + dy * dy;
        const repel2 = CONFIG.repelRadius * CONFIG.repelRadius;

        if (d2 < repel2 && d2 > 0.0001) {
          const dist = Math.sqrt(d2);
          const strength = (1 - dist / CONFIG.repelRadius) * CONFIG.repelForce * dt;
          ax += (dx / dist) * strength;
          ay += (dy / dist) * strength;
        }
      }

      ax -= (this.x - this.ox) * CONFIG.spring * dt;
      ay -= (this.y - this.oy) * CONFIG.spring * dt;

      const damping = Math.pow(CONFIG.friction, dt);
      this.vx = (this.vx + ax) * damping;
      this.vy = (this.vy + ay) * damping;

      this.x += this.vx * dt;
      this.y += this.vy * dt;
    }

    draw() {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
      ctx.fillStyle = hsla(this.hue, 80, 72, this.alpha);
      ctx.fill();
    }
  }

  function syncParticleCount() {
    const target = getTargetParticleCount();

    while (particles.length < target) particles.push(new Particle());
    while (particles.length > target) particles.pop();
  }

  function drawConnections() {
    const maxDist = CONFIG.linkDistance;
    const maxDist2 = maxDist * maxDist;

    for (let i = 0; i < particles.length; i++) {
      const a = particles[i];

      for (let j = i + 1; j < particles.length; j++) {
        const b = particles[j];
        const dx = a.x - b.x;
        const dy = a.y - b.y;
        const d2 = dx * dx + dy * dy;

        if (d2 < maxDist2) {
          const d = Math.sqrt(d2);
          const alpha = (1 - d / maxDist) * 0.18;

          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.strokeStyle = hsla(220, 70, 72, alpha);
          ctx.lineWidth = 0.6;
          ctx.stroke();
        }
      }
    }
  }

  function drawCursor() {
    if (!pointer.active) return;

    ctx.beginPath();
    ctx.arc(pointer.x, pointer.y, 6, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(180,200,255,0.75)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(pointer.x, pointer.y, CONFIG.repelRadius, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(150,170,255,0.10)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  function clear() {
    ctx.clearRect(0, 0, W, H);
  }

  function animate(time = 0) {
    const rawDt = (time - lastTime) / 16.6667 || 1;
    const dt = Math.min(rawDt, 1.6);
    lastTime = time;

    clear();

    for (const p of particles) p.update(dt);
    drawConnections();
    for (const p of particles) p.draw();
    drawCursor();

    rafId = requestAnimationFrame(animate);
  }

  function setPointer(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    pointer.x = clientX - rect.left;
    pointer.y = clientY - rect.top;
    pointer.active = true;
  }

  function resetPointer() {
    pointer.x = -9999;
    pointer.y = -9999;
    pointer.active = false;
  }

  canvas.addEventListener('pointermove', e => setPointer(e.clientX, e.clientY), { passive: true });
  canvas.addEventListener('pointerdown', e => setPointer(e.clientX, e.clientY), { passive: true });
  canvas.addEventListener('pointerleave', resetPointer, { passive: true });
  canvas.addEventListener('pointercancel', resetPointer, { passive: true });

  const ro = new ResizeObserver(() => resizeCanvas());
  ro.observe(canvas);

  resizeCanvas();
  animate();

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      cancelAnimationFrame(rafId);
    } else {
      lastTime = performance.now();
      animate(lastTime);
    }
  });
})();
</script>
